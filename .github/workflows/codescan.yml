# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow requires that you have an existing account with codescan.io
# For more information about configuring your workflow,
# read our documentation at https://github.com/codescan-io/codescan-scanner-action
name: CodeScan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '21 15 * * 1'

permissions:
  contents: read

jobs:
    CodeScan:
        permissions:
          contents: read # for actions/checkout to fetch code
          security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
          actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
        runs-on: ubuntu-latest
        env:
          CODESCAN_AUTH_TOKEN: ${{ secrets.CODESCAN_AUTH_TOKEN }}
          CODESCAN_ORGANIZATION_KEY: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
          CODESCAN_PROJECT_KEY: ${{ secrets.CODESCAN_PROJECT_KEY }}
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Set up Java 17
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '17'
            -   name: Cache files
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.sonar
                    key: ${{ runner.os }}-sonar
                    restore-keys: ${{ runner.os }}-sonar
            -   name: Run Analysis
                if: ${{ env.CODESCAN_AUTH_TOKEN != '' && env.CODESCAN_ORGANIZATION_KEY != '' && env.CODESCAN_PROJECT_KEY != '' }}
                uses: codescan-io/codescan-scanner-action@955d3d1b4a9e374064189719484005ce8e08a749
                with:
                    login: ${{ env.CODESCAN_AUTH_TOKEN }}
                    organization: ${{ env.CODESCAN_ORGANIZATION_KEY }}
                    projectKey: ${{ env.CODESCAN_PROJECT_KEY }}
                    generateSarifFile: true
            -   name: Skip CodeScan when credentials are unavailable
                if: ${{ env.CODESCAN_AUTH_TOKEN == '' || env.CODESCAN_ORGANIZATION_KEY == '' || env.CODESCAN_PROJECT_KEY == '' }}
                run: echo "CodeScan credentials are not configured; skipping external scan."
            -   name: Upload SARIF file
                if: ${{ hashFiles('codescan.sarif') != '' }}
                uses: github/codeql-action/upload-sarif@v3
                with:
                    sarif_file: codescan.sarif
