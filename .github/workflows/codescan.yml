# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow requires that you have an existing account with codescan.io
# For more information about configuring your workflow,
# read our documentation at https://github.com/codescan-io/codescan-scanner-action
name: CodeScan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '21 15 * * 1'

permissions:
  contents: read

jobs:
    CodeScan:
        permissions:
          contents: read # for actions/checkout to fetch code
          security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
          actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            -   name: Check CodeScan configuration
                id: codescan-config
                env:
                    CODESCAN_AUTH_TOKEN: ${{ secrets.CODESCAN_AUTH_TOKEN }}
                    CODESCAN_ORGANIZATION_KEY: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
                    CODESCAN_PROJECT_KEY: ${{ secrets.CODESCAN_PROJECT_KEY }}
                run: |
                    if [ -n "$CODESCAN_AUTH_TOKEN" ] && [ -n "$CODESCAN_ORGANIZATION_KEY" ] && [ -n "$CODESCAN_PROJECT_KEY" ]; then
                      echo "configured=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "configured=false" >> "$GITHUB_OUTPUT"
                      echo "CodeScan secrets are not configured; skipping scan."
                    fi
            -   name: Set up Java 17
                if: ${{ steps.codescan-config.outputs.configured == 'true' }}
                uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
                with:
                    distribution: temurin
                    java-version: '17'
            -   name: Cache files
                if: ${{ steps.codescan-config.outputs.configured == 'true' }}
                uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: |
                        ~/.sonar
                    key: ${{ runner.os }}-sonar
                    restore-keys: ${{ runner.os }}-sonar
            -   name: Run Analysis
                if: ${{ steps.codescan-config.outputs.configured == 'true' }}
                uses: codescan-io/codescan-scanner-action@955d3d1b4a9e374064189719484005ce8e08a749
                with:
                    login: ${{ secrets.CODESCAN_AUTH_TOKEN }}
                    organization: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
                    projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}
                    generateSarif: "1"
            -   name: Upload SARIF file
                if: ${{ steps.codescan-config.outputs.configured == 'true' && hashFiles('codescan.sarif') != '' }}
                uses: github/codeql-action/upload-sarif@865f5f5c36632f18690a3d569fa0a764f2da0c3e # v3
                with:
                    sarif_file: codescan.sarif
