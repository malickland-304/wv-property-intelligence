name: CodeScan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  codescan:
    name: CodeScan Analysis
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache files
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.sonar/cache
          key: ${{ runner.os }}-codescan-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-codescan-

      - name: Run CodeScan
        uses: codescan-io/codescan-scanner-action@v1
        with:
          organization: ${{ secrets.CODESCAN_ORG }}
          projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}
          login: ${{ secrets.CODESCAN_TOKEN }}
          codeScanUrl: ${{ secrets.CODESCAN_URL }}
          generateSarifFile: true
          args: >
            -Dsonar.sarifReportPath=codescan.sarif

      - name: Verify SARIF file
        run: |
          if [ ! -f codescan.sarif ]; then
            echo "❌ SARIF file not found. Failing build."
            exit 1
          else
            echo "✅ SARIF file found."
          fi

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codescan.sarif
