name: Validate API docs consistency

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-api-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if legacy /api/listings still appears in docs
        run: |
          if grep -Rn "/api/listings" -- CONTEXT.md README.md; then
            echo "::error ::CONTEXT.md or README.md references /api/listings but the backend uses /api/properties."
            exit 1
          fi

      - name: Verify Copilot instructions are in .github/ not repo root
        run: |
          if [[ -f "copilot-instructions.md" ]]; then
            echo "::error ::copilot-instructions.md found at repo root. Move it to .github/copilot-instructions.md."
            exit 1
          fi

      - name: Check all documented API routes exist in routes/api.js
        run: |
          # Extract /api/* routes from README and CONTEXT
          doc_routes=$(grep -ohE '/api/[a-zA-Z0-9_/:-]+' CONTEXT.md README.md | sort -u)
          echo "Documented routes:"
          echo "$doc_routes"
          echo ""

          missing=0
          while read -r route; do
            [[ -z "$route" ]] && continue
            # Strip :param segments for matching — check the base path literal
            base=$(echo "$route" | sed -E 's|/:[^/]+||g')
            [[ -z "$base" || "$base" == "/" ]] && continue
            if ! grep -qn "$base" api/routes/api.js api/routes/admin.js api/routes/public.js 2>/dev/null; then
              echo "::warning ::Documented route '$route' not found in api/routes/*.js"
            fi
          done <<< "$doc_routes"

      - name: Warn about /api/health path check in requireApiKey
        run: |
          if grep -n '"/api/health"' api/middleware/auth.js 2>/dev/null; then
            echo "::warning ::auth.js has /api/health path guard but middleware runs inside router (path is /health). Already fixed in code — just a reminder if this reappears."
          fi
