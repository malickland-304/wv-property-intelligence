# Railway deployment config — non-sensitive production defaults.
# Sensitive values (ADMIN_PASSWORD, SESSION_SECRET, GOOGLE_*, etc.)
# must be set in the Railway dashboard under Variables.

[build]
builder = "nixpacks"

[deploy]
startCommand = "cd api && node server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 10

[deploy.envs]
NODE_ENV            = "production"
SITE_URL            = "https://malickland.net"
# DATABASE_PATH must be set to your Railway volume mount path, e.g.:
#   DATABASE_PATH = "/data/wv_property.db"
# Set this in the Railway dashboard — it depends on the volume name you attach.
